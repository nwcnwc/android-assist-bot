name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode release keystore
        id: keys
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keys.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/*-release.apk android-assist-bot.apk
          ls -lh android-assist-bot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-assist-bot
          path: android-assist-bot.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && steps.keys.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: android-assist-bot.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
